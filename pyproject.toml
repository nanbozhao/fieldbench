[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fieldbench"
version = "0.1.0"
description = "Open field-normalized citation benchmarking: percentile-rank any researcher against a topic-defined, career-stage-matched cohort"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bozhao Nan" }]
keywords = ["bibliometrics", "citations", "openalex", "semantic-scholar", "research-evaluation"]
dependencies = []
optional-dependencies = { web = ["fastapi", "uvicorn"] }

[project.urls]
Homepage = "https://github.com/nanbozhao/fieldbench"
Repository = "https://github.com/nanbozhao/fieldbench"

[tool.setuptools.packages.find]
where = ["src"]
